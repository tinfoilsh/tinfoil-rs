name: Tinfoil Conformance

# Runs the cross-SDK Tinfoil conformance suite
# (https://github.com/tinfoilsh/tinfoil-conformance) against this SDK's
# `tinfoil-conformance` binary. Distinct from the upstream sigstore-conformance
# workflow above, which tests the `conformance` binary against the generic
# Sigstore CLI protocol.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: Tinfoil Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tinfoil-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tinfoil-conformance-

      - name: Build tinfoil-conformance binary
        run: cargo build --locked --bin tinfoil-conformance

      - name: Checkout tinfoil-conformance suite
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tinfoilsh/tinfoil-conformance
          ref: main
          path: tinfoil-conformance
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tinfoil-conformance/harness/pyproject.toml

      - name: Install harness
        run: pip install ./tinfoil-conformance/harness

      - name: Show SDK capabilities
        run: |
          tinfoil-conformance capabilities \
            --sdk "tinfoil-rs=${{ github.workspace }}/target/debug/tinfoil-conformance"

      - name: Run conformance vectors
        run: |
          tinfoil-conformance run \
            --sdk "tinfoil-rs=${{ github.workspace }}/target/debug/tinfoil-conformance" \
            --vectors tinfoil-conformance/vectors/sigstore

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinfoil-conformance-results
          path: results/

      - name: Append summary
        if: always()
        run: |
          if [ -f results/latest/results.md ]; then
            cat results/latest/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
