name: Sigstore Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: Sigstore Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-conformance-

      - name: Build conformance binary
        run: cargo build --locked --bin conformance

      - name: Run sigstore-conformance
        uses: sigstore/sigstore-conformance@f725061bb10d8065e506e6fc7022211a24808f6e
        with:
          entrypoint: ${{ github.workspace }}/target/debug/conformance
          skip-signing: true
          # Tests expected to fail due to unimplemented features:
          # - integrated-time-in-future_fail: SET (signed entry timestamp) verification not implemented
          # - checkpoint-bad-keyhint_fail: checkpoint key hint validation not implemented
          # - rekor2-timestamp-*_fail: TSA certificate chain validation not implemented
          xfail: >-
            *integrated-time-in-future_fail*
            *checkpoint-bad-keyhint_fail*
            *rekor2-timestamp-payload-mismatch_fail*
            *rekor2-timestamp-outside-trust-root-tsa-validity_fail*
            *rekor2-timestamp-untrusted-tsa-without-embedded-cert_fail*
            *rekor2-timestamp-untrusted-tsa-with-embedded-cert_fail*
            *rekor2-timestamp-outside-tsa-cert-validity_fail*
