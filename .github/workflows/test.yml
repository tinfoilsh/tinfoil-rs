name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # Don't bail the whole matrix on a single OS failing — we want to
      # see Windows-only or macOS-only regressions even if Linux is red.
      fail-fast: false
      matrix:
        # ubuntu-latest = x86_64-unknown-linux-gnu
        # macos-latest = aarch64-apple-darwin (Apple Silicon)
        # windows-latest = x86_64-pc-windows-msvc — the platform that
        # caught the aws-lc-rs / __builtin_bswap link regression
        # downstream (see #21). Without this matrix entry the bug
        # reaches consumers before any tinfoil-rs test ever notices.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --workspace --verbose

      - name: Test the verifier crate
        run: cargo test --locked -p tinfoil-verifier --verbose

      - name: Test the client crate
        run: cargo test --locked -p tinfoil-next --verbose

      - name: Test the client crate with every feature
        run: cargo test --locked -p tinfoil-next --all-features --verbose

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.88 toolchain
        run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Build on MSRV
        run: cargo build --locked --workspace --verbose

      - name: Test the verifier crate on MSRV
        run: cargo test --locked -p tinfoil-verifier --verbose

      - name: Test the client crate on MSRV
        run: cargo test --locked -p tinfoil-next --verbose

      - name: Test the client crate with every feature on MSRV
        run: cargo test --locked -p tinfoil-next --all-features --verbose

  lint:
    name: Format and clippy (v3 crates)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check -p tinfoil-verifier -p tinfoil-conformance -p tinfoil-next

      - name: Run clippy
        run: cargo clippy --locked -p tinfoil-verifier -p tinfoil-conformance -p tinfoil-next --all-targets -- -D warnings

      # The client's OpenAI and gateway code is behind cargo features.
      - name: Run clippy on the client without its default features
        run: cargo clippy --locked -p tinfoil-next --all-targets --no-default-features -- -D warnings

      - name: Run clippy on the client with every feature
        run: cargo clippy --locked -p tinfoil-next --all-targets --all-features -- -D warnings

      - name: Build the client's documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p tinfoil-next --all-features

      # Without the OpenAI feature, links to its items must not be left
      # dangling.
      - name: Build the client's documentation without its default features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p tinfoil-next --no-default-features

      # The conformance adapter's stages, and the verifier modules that they
      # reach, are compiled only with this flag.
      - name: Run clippy with the conformance stages
        env:
          RUSTFLAGS: --cfg tinfoil_conformance
        run: cargo clippy --locked -p tinfoil-verifier -p tinfoil-conformance --all-targets -- -D warnings

  conformance:
    name: Conformance vectors
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out the shared vectors
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tinfoilsh/tinfoil-conformance
          # Pinned; bump deliberately when the vector suite changes.
          ref: e0063e74ba050706643ee86e11ed4340759e34f1
          path: tinfoil-conformance
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Run the adapter over the vectors
        env:
          # Compiles the adapter's stages in; without the flag every fixture
          # is skipped.
          RUSTFLAGS: --cfg tinfoil_conformance
          # Documentation tests are built by rustdoc, which takes its own flags.
          RUSTDOCFLAGS: --cfg tinfoil_conformance
          TINFOIL_CONFORMANCE_VECTORS: ${{ github.workspace }}/tinfoil-conformance/vectors/v3
        run: |
          cargo test --locked -p tinfoil-conformance -- --nocapture
          cargo test --locked -p tinfoil-verifier --doc

  deny:
    name: Banned dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check banned crates
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans
