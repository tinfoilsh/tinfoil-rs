name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # Don't bail the whole matrix on a single OS failing — we want to
      # see Windows-only or macOS-only regressions even if Linux is red.
      fail-fast: false
      matrix:
        # ubuntu-latest = x86_64-unknown-linux-gnu
        # macos-latest = aarch64-apple-darwin (Apple Silicon)
        # windows-latest = x86_64-pc-windows-msvc — the platform that
        # caught the aws-lc-rs / __builtin_bswap link regression
        # downstream (see #21). Without this matrix entry the bug
        # reaches consumers before any test here notices.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --workspace --verbose

      # Unit, integration and documentation tests of every member, the
      # README's examples among them.
      - name: Test the workspace
        run: cargo test --locked --workspace --verbose

      - name: Test the client crate without its default features
        run: cargo test --locked -p tinfoil --no-default-features --verbose

      - name: Test the client crate with every feature
        run: cargo test --locked -p tinfoil --all-features --verbose

      - name: Test the verifier crate with serde
        run: cargo test --locked -p tinfoil-verifier --features serde --verbose

      - name: Test the verifier crate with serde
        run: cargo test --locked -p tinfoil-verifier --features serde --verbose

      - name: Check if API key is available
        # Bash on every runner: the Windows runner defaults to pwsh.
        id: gate
        shell: bash
        env:
          TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
        run: |
          if [ -z "$TINFOIL_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Against the production router; skipped where the secret is not
      # available, as on pull requests from forks.
      - name: Run the live tests
        if: steps.gate.outputs.run == 'true'
        env:
          TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
        run: cargo test --locked -p tinfoil --test live --verbose -- --ignored

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.88 toolchain
        run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Build on MSRV
        run: cargo build --locked --workspace --verbose

      - name: Test the workspace on MSRV
        run: cargo test --locked --workspace --verbose

      - name: Test the client crate without its default features on MSRV
        run: cargo test --locked -p tinfoil --no-default-features --verbose

      - name: Test the client crate with every feature on MSRV
        run: cargo test --locked -p tinfoil --all-features --verbose

      - name: Test the verifier crate with serde on MSRV
        run: cargo test --locked -p tinfoil-verifier --features serde --verbose

      - name: Test the verifier crate with serde on MSRV
        run: cargo test --locked -p tinfoil-verifier --features serde --verbose

  lint:
    name: Format, clippy and documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The client's OpenAI code is behind cargo features.
      - name: Run clippy on the client without its default features
        run: cargo clippy --locked -p tinfoil --all-targets --no-default-features -- -D warnings

      - name: Run clippy with every feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # The conformance adapter's stages, and the verifier modules that they
      # reach, are compiled only with this flag.
      - name: Run clippy with the conformance stages
        env:
          RUSTFLAGS: --cfg tinfoil_conformance
        run: cargo clippy --locked -p tinfoil-verifier -p tinfoil-conformance --all-targets -- -D warnings

      - name: Build the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace

      - name: Build the documentation with every feature
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace --all-features

      # Without the OpenAI feature, links to its items must not be left
      # dangling.
      - name: Build the client's documentation without its default features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p tinfoil --no-default-features

  conformance:
    name: Conformance vectors
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out the shared vectors
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tinfoilsh/tinfoil-conformance
          # Pinned; bump deliberately when the vector suite changes.
          ref: e0063e74ba050706643ee86e11ed4340759e34f1
          path: tinfoil-conformance
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Run the adapter over the vectors
        env:
          # Compiles the adapter's stages in; without the flag every fixture
          # is skipped.
          RUSTFLAGS: --cfg tinfoil_conformance
          # Documentation tests are built by rustdoc, which takes its own flags.
          RUSTDOCFLAGS: --cfg tinfoil_conformance
          TINFOIL_CONFORMANCE_VECTORS: ${{ github.workspace }}/tinfoil-conformance/vectors/v3
        # The verifier's own tests run here too: with the vectors at hand
        # its replay of them checks every recorded verdict, and it fails
        # if a case is skipped.
        run: |
          cargo test --locked -p tinfoil-conformance -- --nocapture
          cargo test --locked -p tinfoil-verifier

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Advisories, banned crates, licences and sources, as deny.toml sets
      # them, for every feature and against the committed lockfile.
      - name: Check advisories, bans, licences and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
