name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --verbose

      - name: Run unit tests
        run: cargo test --locked --lib --verbose

      - name: Run integration tests
        run: cargo test --locked --test '*' --verbose

      - name: Check if API key is available
        id: gate
        env:
          TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
        run: |
          if [ -z "$TINFOIL_API_KEY" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Run API integration tests
        if: steps.gate.outputs.run == 'true'
        env:
          TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
        run: cargo test --locked --test '*' --verbose -- --ignored
