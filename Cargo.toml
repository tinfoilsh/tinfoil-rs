[workspace]
members = ["conformance", "crates/client", "crates/verifier"]
resolver = "2"

# The client and the verifier are released together, under one version and
# one git tag.
[workspace.package]
version = "0.3.0-rc.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/tinfoilsh/tinfoil-rs"

[workspace.dependencies]
# The client is built and tested against exactly this verifier, so the
# requirement is exact. Keep it equal to the workspace version above.
tinfoil-verifier = { path = "crates/verifier", version = "=0.3.0-rc.1" }

# Lints for the workspace members that opt in with `lints.workspace = true`.
# The verifier parses untrusted input, so anything that can panic on a
# malformed document is denied outside tests (see clippy.toml). Clippy cannot
# exempt tests from `arithmetic_side_effects`, so each member allows it for
# its own test code.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tinfoil_conformance)"] }

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
