[package]
name = "tinfoil"
version = "0.1.0"
edition = "2021"
description = "Rust client for Tinfoil secure enclaves with hardware attestation verification"
license = "AGPL-3.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Streaming (chat_relaxed::create_stream and SSE parser)
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

# OpenAI-compatible API client (injected with our pinned reqwest client)
async-openai = { version = "0.34", features = ["chat-completion", "embedding", "audio", "responses"] }

# TLS 
rustls = "0.23"
webpki-roots = "0.26"
tokio-rustls = "0.26"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# AMD SEV-SNP attestation with crypto verification (no OpenSSL)
sev = { version = "7", default-features = false, features = ["snp", "crypto_nossl"] }

# Crypto primitives
digest = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2", features = ["sct"] }

# TLS encoding for SCT verification (used by x509-cert's sct feature)
tls_codec = { version = "0.4", features = ["derive"] }
der = "0.7"
const-oid = { version = "0.9", features = ["db"] }
p384 = "0.13"
p256 = "0.13"  # For Fulcio certificate ECDSA (P-256/secp256r1)
ecdsa = { version = "0.16", features = ["verifying"] }
ed25519-dalek = "2"  # For Rekor log2025-1 Ed25519 signatures

# RSA for certificate chain verification (AMD certs use RSA-PSS)
rsa = "0.9"

# PEM parsing
pem = "3"

# Compression
flate2 = "1"

# Base64 decoding
base64 = "0.22"

# Base32 decoding (for dcode SAN encoding)
data-encoding = "2"

# Error handling
thiserror = "1"

# Hex encoding
hex = "0.4"

# Platform cache directory
dirs = "6"

# Sigstore verification
# sigstore-rs 0.13 cannot be used because it requires the `oauth` module
# even for verification-only use cases, and that module uses Rust edition 2024
# let-chains which don't compile on stable Rust (see rust-lang/rust#145878).
# We implement DSSE verification manually in src/sigstore.rs instead.

# Regex for certificate identity matching
regex = "1"

# Pinned to <0.3.46 because newer releases bump the MSRV to Rust 1.88, which
# would force everyone consuming tinfoil-rs to upgrade their toolchain.
time = { version = ">=0.3, <0.3.46", features = ["parsing"] }

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[dev-dependencies]
tokio-test = "0.4"
hex-literal = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
futures-util = "0.3"
