[package]
name = "tinfoil"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Rust client for Tinfoil secure enclaves with hardware attestation verification"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
# `rustls-no-provider` instead of `rustls` so reqwest doesn't pull
# `__rustls-aws-lc-rs` — this crate's TLS deps below pin ring, and we
# want to honor that all the way through. Without this, hyper-rustls
# enables aws-lc-rs alongside ring, the C source still ships in the
# link, and MSVC fails on the missing __builtin_bswap symbols even
# though we never use aws-lc-rs at runtime.
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls-no-provider", "stream"] }

# Streaming (chat_relaxed::create_stream and SSE parser)
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

# OpenAI-compatible API client (injected with our pinned reqwest client)
# `default-features = false` so async-openai doesn't activate its
# `rustls` feature (which forwards to reqwest's `rustls` feature, which
# is the aws-lc-rs path). Our own reqwest dep above already enables
# `rustls-no-provider`; Cargo unifies the feature sets so async-openai
# uses tinfoil's reqwest configuration without leaking aws-lc-rs in.
# `middleware` exposes the tower execution hook the user-cache-secret
# layer plugs into (src/user_cache_secret.rs); it pulls no new crates.
async-openai = { version = "0.41.1", default-features = false, features = ["chat-completion", "embedding", "audio", "responses", "middleware"] }

# Service/Layer traits for the user-cache-secret injection layer. Already
# in the dependency graph via reqwest and async-openai; this only makes
# the traits nameable here.
tower = { version = "0.5", default-features = false }

# TLS — pinned to the `ring` crypto backend so this crate links on
# Windows MSVC. The default rustls 0.23 feature set is `aws_lc_rs`,
# which compiles C using GCC `__builtin_bswap{16,32,64}` intrinsics
# that cl.exe doesn't recognize. The link then fails:
#
#   libaws_lc_sys-...md4.o : error LNK2001: unresolved external
#       symbol __builtin_bswap32
#   fatal error LNK1120: 3 unresolved externals
#
# `ring` is supported as a first-class rustls backend and links cleanly
# on every desktop target. `default-features = false` is required to
# keep `aws_lc_rs` from being activated alongside `ring`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# AMD SEV-SNP attestation with crypto verification (no OpenSSL)
sev = { version = "8", default-features = false, features = ["snp", "crypto_nossl"] }

# Crypto primitives
digest = "0.10"
sha2 = { version = "0.10", features = ["oid"] }

# EHBP (Encrypted HTTP Body Protocol) — HPKE request sealing to the
# attested enclave key plus AES-256-GCM response chunks (RFC 9180 /
# EHBP SPEC). `rustls-no-provider` instead of the default feature so
# reqwest doesn't pull `__rustls-aws-lc-rs`, keeping the ring-only TLS
# constraint above intact on Windows MSVC.
tinfoil-ehbp = { version = "0.2.6", git = "https://github.com/tinfoilsh/encrypted-http-body-protocol", rev = "fee6a0f33e27792d097a38ee804fcf4370802ad9", default-features = false, features = ["rustls-no-provider"] }
x509-cert = { version = "0.2", features = ["sct"] }

# TLS encoding for SCT verification (used by x509-cert's sct feature)
tls_codec = { version = "0.4", features = ["derive"] }
der = "0.7"
const-oid = { version = "0.9", features = ["db"] }
p384 = "0.13"
p256 = "0.13"  # For Fulcio certificate ECDSA (P-256/secp256r1)
ecdsa = { version = "0.16", features = ["verifying"] }
ed25519-dalek = "3"  # For Rekor log2025-1 Ed25519 signatures

# RSA for certificate chain verification (AMD certs use RSA-PSS)
rsa = "0.9"

# PEM parsing
pem = "3"

# Compression
flate2 = "1"

# Base64 decoding
base64 = "0.22"

# Base32 decoding (for dcode SAN encoding)
data-encoding = "2"

# Error handling
thiserror = "2"

# Hex encoding
hex = "0.4"

# Platform cache directory
dirs = "6"

# Sigstore verification
# sigstore-rs 0.13 cannot be used because it requires the `oauth` module
# even for verification-only use cases, and that module uses Rust edition 2024
# let-chains which don't compile on stable Rust (see rust-lang/rust#145878).
# We implement DSSE verification manually in src/sigstore.rs instead.

# Regex for certificate identity matching
regex = "1"

time = { version = "0.3", features = ["parsing"] }
reqwest-middleware = { version = "0.5.1", default-features = false, features = ["json", "multipart", "query"] }
http = "1"
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[dev-dependencies]
tokio-test = "0.4"
hex-literal = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
futures-util = "0.3"
# Independent enclave-side EHBP crypto so tests verify the SDK's use of
# the released client against a separate implementation of the spec.
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
aes-gcm = "0.10"
rand = { version = "0.9", default-features = false, features = ["os_rng", "std_rng"] }
