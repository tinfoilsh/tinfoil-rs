[package]
name = "tinfoil-conformance"
version = "0.0.0"
description = "Conformance adapter that drives the Tinfoil verifier from the shared v3 vectors"
# A test tool of this repository: never released.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The client that `live-verify` connects to an enclave with. Without the
# OpenAI clients, which the command does not use.
tinfoil = { path = "../crates/client", default-features = false }
tinfoil-verifier = { workspace = true }
# The runtime that the client needs.
tokio = { version = "1", default-features = false, features = ["rt"] }

[lints]
workspace = true
