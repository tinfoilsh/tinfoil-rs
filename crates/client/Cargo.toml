[package]
name = "tinfoil-next"
version = "0.0.0"
description = "Attested HTTP and OpenAI clients for Tinfoil enclaves"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["openai"]
# The OpenAI clients over `async-openai`, the relaxed chat helper, the
# server-sent-event parser and the multimodal helpers. Of async-openai's API
# families it enables chat completions, embeddings, audio and responses
# (see the dependency below); the `openai-*` features add the others.
openai = [
    "dep:async-openai",
    "dep:async-stream",
    "dep:base64",
    "dep:bytes",
    "dep:futures-core",
    "dep:tower-layer",
    "dep:tower-service",
]
# Further API families of async-openai. Each implies `openai` and enables
# the async-openai feature of the same family, whose calls then exist on
# the OpenAI clients and go through the attested HTTP client like the
# rest. These async-openai features have no counterpart: `realtime` opens
# WebSocket connections of its own, which the attested client cannot
# protect; `webhook` verification and `openapi` schema generation make no
# request; and `video` is deprecated by async-openai.
openai-administration = ["openai", "async-openai/administration"]
openai-batches = ["openai", "async-openai/batch"]
openai-byot = ["openai", "async-openai/byot"]
openai-chatkit = ["openai", "async-openai/chatkit"]
openai-completions = ["openai", "async-openai/completions"]
openai-containers = ["openai", "async-openai/container"]
openai-content-provenance-checks = ["openai", "async-openai/content-provenance-checks"]
openai-evals = ["openai", "async-openai/evals"]
openai-files = ["openai", "async-openai/file"]
openai-fine-tuning = ["openai", "async-openai/finetuning"]
openai-images = ["openai", "async-openai/image"]
openai-models = ["openai", "async-openai/model"]
openai-moderations = ["openai", "async-openai/moderation"]
openai-safety = ["openai", "async-openai/safety"]
openai-skills = ["openai", "async-openai/skill"]
openai-uploads = ["openai", "async-openai/upload"]
openai-vector-stores = ["openai", "async-openai/vectorstore"]
# The gateway route. Experimental: everything behind this feature may change
# or be removed in any release.
unstable-gateway = ["dep:base64", "dep:hkdf", "dep:hmac"]

[dependencies]
tinfoil-verifier = { path = "../verifier", version = "=0.1.0" }

# HTTP. `rustls-no-provider` keeps reqwest from selecting a rustls crypto
# provider: the clients hand it a TLS configuration built on `ring`, and
# reqwest's `rustls` feature would add aws-lc-rs, which does not link on
# Windows MSVC and is banned in deny.toml.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider", "stream"] }
http = "1"
# The host type of the URLs that reqwest takes.
url = "2"
# Observes whether a streamed request body produces any data.
http-body-util = "0.1"

# TLS, on the `ring` provider only. `default-features = false` keeps
# `aws_lc_rs` out of rustls's feature set.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The parser that validated a server's chain also yields the public key that
# the pin is compared with. 0.103.16 distrusts the compromised eMudhra
# intermediates.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["ring", "std"] }
# 1.0.10 drops the eMudhra root behind those intermediates.
webpki-roots = "1.0.10"

# Sealed bodies. `rustls-no-provider` for the same reason as reqwest's.
tinfoil-ehbp = { version = "0.4.1", git = "https://github.com/tinfoilsh/encrypted-http-body-protocol", tag = "v0.4.1", default-features = false, features = ["rustls-no-provider"] }

# Timers and the locks that are held across an await. The clients need a
# Tokio runtime, as reqwest does.
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
# One verification shared by every caller that waits for it.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

getrandom = { version = "0.3", features = ["std"] }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

# OpenAI (feature `openai`). `default-features = false` keeps async-openai
# from enabling reqwest's `rustls` feature; `middleware` is the hook that the
# attested HTTP client is installed through.
async-openai = { version = "0.42.2", default-features = false, features = ["chat-completion", "embedding", "audio", "responses", "middleware"], optional = true }
async-stream = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }
bytes = { version = "1", optional = true }
futures-core = { version = "0.3", optional = true }
# The traits of the service that is installed under async-openai.
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }

# Gateway (feature `unstable-gateway`): the cache salt and the cache prefix.
hkdf = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for the cache-secret file.
libc = "0.2"

[dev-dependencies]
# The enclave's side of the sealed-body protocol, for the local server that
# the EHBP mode is tested against: `tinfoil-ehbp` has the client's side only.
aes-gcm = "0.10"
hpke = "0.13"
futures-core = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }

[[example]]
name = "openai_drop_in"
required-features = ["openai"]

[lints]
workspace = true
