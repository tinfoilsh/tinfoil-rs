[package]
name = "tinfoil-verifier"
description = "Offline verification of Tinfoil enclave attestation documents"
keywords = ["tinfoil", "attestation", "enclave", "sev-snp", "tdx"]
categories = ["cryptography", "authentication"]
# Releases are git tags of the repository; nothing is uploaded to a registry.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
cms = { version = "0.2", default-features = false, features = ["std"] }
der = { version = "0.7", default-features = false, features = ["std", "oid", "derive"] }
ecdsa = { version = "0.16", default-features = false, features = ["verifying", "der", "std"] }
ed25519-dalek = { version = "3", default-features = false }
getrandom = { version = "0.3", features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std"] }
saphyr-parser = "0.3.3"
serde = { version = "1", default-features = false, features = ["std"], optional = true }
sha1 = "0.10"
sha2 = "0.10"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
# Drives the `serde` feature's implementations in tests.
serde_json = "1"

[features]
# `serde::Serialize` for `Verification`, `Register`, `Measurement` and
# `Expected`.
serde = ["dep:serde"]

[lints]
workspace = true
